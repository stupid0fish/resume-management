<!DOCTYPE html>
<html style="width:400px; padding:10px; margin:0;">
<head>
  <meta charset="UTF-8">
  <style>
    textarea { width: 100%; height: 320px; resize: none; padding:6px; box-sizing:border-box; }
    button { width:100%; margin-top:8px; padding:8px; background:#2563eb; color:#fff; border:none; border-radius:4px; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    #copyBtn {background:#059669}
  </style>
</head>
<body>
  <textarea id="resumeBox" placeholder="点击抓取简历"></textarea>
  <button id="captureBtn">抓取当前简历</button>
  <button id="copyBtn">复制内容</button>
  <script src="popup.js"></script>
</body>
</html>
